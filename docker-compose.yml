services:
  navigation:
    build:
      context: ./navigation
      dockerfile: Dockerfile.multistage
    container_name: navigation_service
    ports:
      - "8000:8000"
    volumes:
      - ./navigation:/app
      - /app/.venv  # Exclude .venv from volume mount
      - navigation_uv_cache:/root/.cache/uv
    environment:
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      PROCESSING_SERVICE_URL: ${PROCESSING_SERVICE_URL:-http://172.18.0.3:8000}
      NAVIGATION_SERVICE_URL: ${NAVIGATION_SERVICE_URL:-http://172.18.0.2:8000}
      APP_NAME: ${APP_NAME:-DTK_LLM}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_DATE: ${BUILD_DATE:-05-08-2025}
      LICENSE: ${LICENSE:-MIT License}
      HF_HOME: ${HF_HOME:-/.cache/huggingface}
      REPORT_DIR: ${REPORT_DIR:-/reports}
    restart: unless-stopped
    profiles: ["all", "navigation"]
    networks:
      dtk_network:
        ipv4_address: 172.18.0.2
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
        reservations:
          memory: 1G

  processing:
    build:
      context: ./processing
      dockerfile: Dockerfile.multistage
    container_name: processing_service
    ports:
      - "8001:8000"
    volumes:
      - ./processing:/app
      - /app/.venv  # Exclude .venv from volume mount
      - processing_uv_cache:/root/.cache/uv
    environment:
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST:-172.18.0.4}
      MONGO_PORT: ${MONGO_PORT:-27017}
      QUEUE_WORKERS: ${QUEUE_WORKERS:-1}
      NAVIGATION_SERVICE_URL: ${NAVIGATION_SERVICE_URL:-http://172.18.0.2:8000}
      PROCESSING_SERVICE_URL: ${PROCESSING_SERVICE_URL:-http://172.18.0.3:8000}
      SEED_DB_ON_BUILD: ${SEED_DB_ON_BUILD:-False}
      HF_HOME: ${HF_HOME:-/.cache/huggingface}
    depends_on:
      - processing-db
    restart: unless-stopped
    profiles: ["all", "processing"]
    networks:
      dtk_network:
        ipv4_address: 172.18.0.3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          memory: 8G

  processing-db:
    image: mongo:8.0
    container_name: processing_db
    ports:
      - "27017:27017"
    volumes:
      - processing_db_data:/data/db
      - ./processing/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: admin
    restart: unless-stopped
    profiles: ["all", "processing"]
    networks:
      dtk_network:
        ipv4_address: 172.18.0.4
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M

volumes:
  processing_db_data:
    driver: local
  navigation_uv_cache:
    driver: local
  processing_uv_cache:
    driver: local
  processing_hf_cache:
    driver: local

networks:
  dtk_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
