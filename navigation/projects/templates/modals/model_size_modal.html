<!-- Modal for Model Size Confirmation -->
<div id="model-size-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
            <h3 class="text-lg font-medium text-gray-900">Confirm Model Download</h3>
            <button 
                type="button" 
                onclick="closeModal()"
                class="text-gray-400 hover:text-gray-600 transition-colors duration-200"
            >
                <i class="fa-solid fa-times text-lg"></i>
            </button>
        </div>
        <div class="px-6 py-4">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-xl"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-gray-700 mb-2">
                        <span class="font-medium" id="modal-model-name"></span>
                    </p>
                    <p class="text-sm text-gray-500">
                        Download size: <span class="font-medium" id="modal-model-size"></span>
                    </p>
                    <p class="text-sm text-gray-500 mt-2">
                        Are you sure you want to proceed with using this model?
                    </p>
                    <p class="text-sm text-red-500 mt-2">
                        <strong>Note:</strong> The model will be downloaded after finishing the complete project setup.
                    </p>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
            <button 
                type="button" 
                onclick="closeModal()"
                class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors duration-200"
            >
                Cancel
            </button>
            <button 
                type="button" 
                onclick="confirmDownload()"
                class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200"
            >
                Confirm
            </button>
        </div>
    </div>
</div>
