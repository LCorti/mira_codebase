<!-- Step 1: Project Information -->
<div id="step-1" class="wizard-step">
    <!-- Project Information -->
    <div class="bg-white rounded-lg shadow-xl mb-8 border border-gray-200">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-lg font-medium text-gray-700">Project Information</h2>
        </div>
        <div class="px-6 py-6 space-y-4">
            <!-- Project Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    Project Name <span class="text-red-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    required
                    placeholder="Enter a descriptive name for your project"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors duration-200"
                >
                <p class="text-sm text-gray-500 mt-1">This will be used to identify your project in the dashboard.</p>
            </div>

            <!-- Project Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                    Description
                </label>
                <textarea 
                    id="description" 
                    name="description"
                    rows="3"
                    placeholder="Optional description of your project's purpose and goals"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors duration-200"
                ></textarea>
            </div>

            <!-- Auto Run -->
            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input 
                        id="auto_run" 
                        name="auto_run" 
                        type="checkbox" 
                        value="true"
                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary focus:ring-2"
                    >
                </div>
                <div class="ml-3 text-sm">
                    <label for="auto_run" class="font-medium text-gray-700">Auto-run project</label>
                    <p class="text-gray-500">Automatically create and execute all tests for this project after creation.</p>
                </div>
            </div>
        </div>
    </div>
</div>
