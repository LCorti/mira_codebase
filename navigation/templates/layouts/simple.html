{% extends "head.html" %}

{% block body %}
<div class="flex h-screen">
    <!-- Simplified Sidebar -->
    <div class="w-16 bg-white flex flex-col items-center py-4 border-r border-gray-200">
        <!-- Logo -->
        <div class="w-10 h-10 flex items-center justify-center mb-6">
            <a href="{% url 'projects_index' %}">
                <i class="fas fa-robot text-primary text-2xl"></i>
            </a>
        </div>
        
        <!-- Back Button -->
        <div class="sidebar-item relative">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600 hover:text-primary transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <div class="sidebar-tooltip">Back</div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Simple Top Bar -->
        <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-semibold text-gray-800">
                    {% block page_title %}MIRA - Ready To Work{% endblock %}
                </h1>
            </div>
        </div>
        
        <!-- Content Area -->
        <div class="flex-1 overflow-auto">
            {% block content %}
            <!-- Page content goes here -->
            {% endblock %}
        </div>
    </div>
</div>
{% endblock %}
