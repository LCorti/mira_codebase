<!-- Parameters Modal -->
<div id="parameters-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-900" id="modal-title">Parameter Set Details</h3>
                <button onclick="closeParametersModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="mt-4">
                <div class="bg-gray-50 rounded-lg p-4 mb-4">
                    <h4 class="font-medium text-gray-800 mb-2">Parameters</h4>
                    <pre id="modal-parameters" class="text-sm text-gray-600 whitespace-pre-wrap"></pre>
                </div>
                
                <!-- Job Group Statistics -->
                <div id="modal-statistics" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Statistics will be populated by JavaScript -->
                </div>
            </div>
            
            <!-- Modal Footer -->
            <div class="flex items-center justify-end pt-4 border-t border-gray-200 space-x-3">
                <button onclick="closeParametersModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
