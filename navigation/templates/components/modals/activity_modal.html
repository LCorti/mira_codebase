<!-- Activity Details Modal -->
<div id="activity-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-900" id="activity-modal-title">Activity Details</h3>
                <button onclick="closeActivityModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="mt-4">
                <!-- Activity Info -->
                <div class="bg-gray-50 rounded-lg p-4 mb-4">
                    <div class="flex items-center space-x-3">
                        <div id="activity-modal-icon-container" class="flex-shrink-0 w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-info-circle text-blue-600"></i>
                        </div>
                        <div class="flex-1">
                            <h4 id="activity-modal-type" class="font-medium text-gray-800"></h4>
                            <p id="activity-modal-timestamp" class="text-sm text-gray-500"></p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <p id="activity-modal-summary" class="text-sm text-gray-600"></p>
                    </div>
                </div>
                
                <!-- Changes Details -->
                <div id="activity-modal-changes" class="space-y-4">
                    <!-- Changes will be populated by JavaScript -->
                </div>
            </div>
            
            <!-- Modal Footer -->
            <div class="flex items-center justify-end pt-4 border-t border-gray-200 space-x-3">
                <button onclick="closeActivityModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
